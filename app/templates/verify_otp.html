
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureBank | Verify Mobile</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #101b3d, #155e75);
        }
        .card {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 32px;
            border-radius: 18px;
            text-align: center;
        }
        h1 { color: #155e75; }
        p { color: #64748b; }
        input {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 20px;
            text-align: center;
            letter-spacing: 8px;
        }
        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: 0;
            border-radius: 9px;
            background: #155e75;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        .message {
            padding: 10px;
            background: #f1f5f9;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .notice { font-size: 12px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>SecureBank</h1>
        <h2>Mobile Verification</h2>
        <p>Enter the six-digit demo OTP to verify your account.</p>

        {% with messages = get_flashed_messages() %}
          {% for message in messages %}
            <div class="message">{{ message }}</div>
          {% endfor %}
        {% endwith %}

        <form method="POST">
            <input type="text" name="otp"
                   inputmode="numeric" pattern="[0-9]{6}"
                   maxlength="6" minlength="6"
                   placeholder="000000" required>
            <button type="submit">Verify Account</button>
        </form>

        <p class="notice">
            Demo verification only. No real SMS is sent.
        </p>
    </div>
</body>
</html>
